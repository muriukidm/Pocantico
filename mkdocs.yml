site_name: Pocantico Operations
site_description: Cloud & Network Engineering Portfolio
site_author: Denis Muriuki

theme:
  name: material
  variant: classic
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - .icons
nav:
  - Home: index.md
  - Engineering Domains:
      - Cloud & IaC (Azure): runbooks/azure/az-900.md
      - Linux & Systems Admin: runbooks/linux/rhel9.md
      - Enterprise Networking: runbooks/networking/ccna.md
  - Technology Index: tags.md
  - About: about.md