site_name: "Pocantico | Cloud & Network Engineering"

theme:
  name: material
  icon:
    logo: material/console-network-outline
  favicon: material/console-network-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.top
    - navigation.footer      # Activates the Next/Previous footer
    - search.suggest         # Rich predictive search modal
    - search.highlight       # Highlights search terms in results
    - content.code.copy

extra_css:
  - stylesheets/custom.css   # Hooks in our background image

extra:
  analytics:
    provider: google
    property: G-63E6KHYEDB  
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/muriukidm
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/yourprofile  # Update this

copyright: Copyright &copy; 2026 Denis Muriuki

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.progressbar     # Enables gamified progress tracking
  - pymdownx.tasklist:       # Enables interactive checkboxes
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: docs/includes

plugins:
  - search
  - blog:
      archive: true
      archive_date_format: yyyy
  - tags
  - mkdocstrings
  
nav:
  - Home: index.md
  - Runbooks:
      - Azure Infrastructure (Bicep): runbooks/azure-bicep.md
      - CCNA Networking: runbooks/ccna.md
      - RHEL 9 Administration: runbooks/rhel9.md
  - Projects:
      - Social Threat Guardian (DistilBERT): https://github.com/muriukidm/social-threat-guardian
  - Blog: blog/index.md
  - About: about.md